# BLOQUE 4-5 · Cross-platform release CI (Linux + macOS + Windows)
# Council ya aprobó (B3/B4) skip-AIE-sidecar + Linux first → Windows second.
# Triggers manuales (workflow_dispatch) o sobre tag v*.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match src-tauri/tauri.conf.json `version` — bump both before dispatching; pre-release suffixes sort BELOW the equivalent stable per SemVer)."
        required: true
        default: "v0.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            target: "macos"
          - platform: "ubuntu-22.04"
            # Council EDGE: build en Ubuntu 22.04 fija WebKitGTK 4.1, evita falla en Fedora.
            args: ""
            target: "linux"
          - platform: "windows-latest"
            args: ""
            target: "windows"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux deps (WebKitGTK 4.1 + AppImage tools)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      # C1 v7 — fail fast if the tag doesn't match tauri.conf.json version.
      # Tauri updater reads currentVersion from the app metadata, so a mismatch
      # would publish a manifest the app keeps trying (and failing) to install.
      - name: Verify tag matches tauri.conf.json version
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Lowercase both sides for defense (tags never have mixed case in practice,
          # but cheap insurance against operator error).
          EXPECTED="$(printf '%s' "${TAG#v}" | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'].lower())")"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "❌ tag=$TAG (version=$EXPECTED) does not match tauri.conf.json version=$ACTUAL" >&2
            echo "   bump tauri.conf.json before pushing the tag." >&2
            exit 1
          fi
          echo "✓ tag $TAG matches tauri.conf.json version $ACTUAL"

      - name: Build frontend
        run: npm run build

      # C1 v3 — pass `--config` inline to set beforeBuildCommand=""
      # so the signing env never reaches an npm lifecycle step.
      - name: Tauri build (macOS — Developer ID signed via env)
        if: matrix.target == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri && cargo install tauri-cli --version "^2" --locked || true
          cd .. && npx tauri build --config '{"build":{"beforeBuildCommand":""}}' ${{ matrix.args }}

      - name: Tauri build (Linux)
        if: matrix.target == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri && cargo install tauri-cli --version "^2" --locked || true
          cd .. && npx tauri build --config '{"build":{"beforeBuildCommand":""}}' ${{ matrix.args }}

      - name: Tauri build (Windows — Azure Trusted Signing)
        if: matrix.target == 'windows'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri ; cargo install tauri-cli --version "^2" --locked
          cd .. ; npx tauri build --config '{"build":{"beforeBuildCommand":""}}' ${{ matrix.args }}

      # Codex HIGH v4: upload updater .sig files alongside the bundles so the
      # updater manifest can reference them.
      - name: Upload artifacts (macOS)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: furx-macos
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig

      # Council K must-fix 5/5: verify each Linux bundle actually produced
      # before uploading. Without this, a missing .rpm could ship as a "good"
      # release because the workflow only checks the overall tauri-build exit
      # code, which succeeds even with partial outputs.
      - name: Validate Linux bundles
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1 || true)
          RPM=$(ls src-tauri/target/release/bundle/rpm/*.rpm 2>/dev/null | head -1 || true)
          AI=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1 || true)
          missing=""
          [ -n "$DEB" ] || missing="$missing deb"
          [ -n "$RPM" ] || missing="$missing rpm"
          [ -n "$AI"  ] || missing="$missing AppImage"
          if [ -n "$missing" ]; then
            echo "❌ Linux bundles missing:$missing" >&2
            ls -laR src-tauri/target/release/bundle/ >&2
            exit 1
          fi
          # Structural sanity: dpkg parses the .deb header; rpm reads metadata;
          # file(1) confirms the AppImage magic + ELF wrapper. Pure validation,
          # no install or exec — safe in CI.
          dpkg-deb --info "$DEB" >/dev/null
          # rpm is not in the default ubuntu image — install once, then re-run.
          if ! command -v rpm >/dev/null; then sudo apt-get install -y rpm >/dev/null; fi
          rpm -qp --info "$RPM" >/dev/null
          # Audit Llama HIGH: file(1) wording varies — AppImage tag on newer
          # systems, just "ELF" / "executable" on older ones. Accept all three.
          file "$AI" | grep -qE "(AppImage|ELF|executable)" || { echo "❌ $AI not recognised"; file "$AI" >&2; exit 1; }
          test -x "$AI" || { echo "❌ $AI not executable" >&2; exit 1; }
          echo "✓ Linux bundles validated: $(basename "$DEB"), $(basename "$RPM"), $(basename "$AI")"

      - name: Upload artifacts (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: furx-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

      - name: Upload artifacts (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: furx-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Refuse to publish on a malformed/arbitrary workflow_dispatch tag — only a
      # SemVer v-tag (v0.2.0, v0.2.0-rc.1) may produce a public release.
      - name: Validate release tag (SemVer v*)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing to release: tag '$TAG' is not a SemVer v-tag (e.g. v0.2.0 or v0.2.0-rc.1)." >&2
            exit 1
          fi
          echo "Release tag OK: $TAG"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      # C1 v5 — generate latest.json. Use `find` instead of fixed globs because
      # upload-artifact strips path prefixes inconsistently. Fail hard if any
      # platform-required sig/url is missing.
      - name: Generate updater manifest (latest.json)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${REPO:?}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          find_one() {
            # $1 = artifact dir (e.g. artifacts/furx-macos), $2 = filename glob.
            # Fail if more than one match — that would indicate a workflow bug
            # (debug+release leaking, or duplicate uploads).
            local matches
            matches="$(find "$1" -type f -name "$2" 2>/dev/null)"
            local count
            count="$(printf '%s\n' "$matches" | grep -c . || true)"
            if [ "$count" -gt 1 ]; then
              echo "❌ multiple matches for $2 in $1:" >&2
              printf '%s\n' "$matches" >&2
              exit 1
            fi
            printf '%s\n' "$matches" | head -1
          }

          mac_tar="$(find_one artifacts/furx-macos '*.app.tar.gz')"
          mac_sig_file="$(find_one artifacts/furx-macos '*.app.tar.gz.sig')"
          linux_img="$(find_one artifacts/furx-linux '*.AppImage')"
          linux_sig_file="$(find_one artifacts/furx-linux '*.AppImage.sig')"
          linux_deb="$(find_one artifacts/furx-linux '*.deb')"
          linux_deb_sig_file="$(find_one artifacts/furx-linux '*.deb.sig')"
          linux_rpm="$(find_one artifacts/furx-linux '*.rpm')"
          linux_rpm_sig_file="$(find_one artifacts/furx-linux '*.rpm.sig')"
          win_exe="$(find_one artifacts/furx-windows '*.exe')"
          win_sig_file="$(find_one artifacts/furx-windows '*.exe.sig')"

          missing=()
          [ -z "$mac_tar" ]   && missing+=("macos tar.gz")
          [ -z "$mac_sig_file" ]   && missing+=("macos .sig")
          [ -z "$linux_img" ] && missing+=("linux AppImage")
          [ -z "$linux_sig_file" ] && missing+=("linux AppImage .sig")
          [ -z "$linux_deb" ] && missing+=("linux .deb")
          [ -z "$linux_deb_sig_file" ] && missing+=("linux .deb.sig")
          [ -z "$linux_rpm" ] && missing+=("linux .rpm")
          [ -z "$linux_rpm_sig_file" ] && missing+=("linux .rpm.sig")
          [ -z "$win_exe" ]   && missing+=("windows exe")
          [ -z "$win_sig_file" ]   && missing+=("windows .sig")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ Missing updater artifacts: ${missing[*]}" >&2
            echo "Found tree:" >&2
            find artifacts -maxdepth 6 -type f | head -50 >&2
            exit 1
          fi

          mac_sig="$(cat "$mac_sig_file")"
          linux_sig="$(cat "$linux_sig_file")"
          linux_deb_sig="$(cat "$linux_deb_sig_file")"
          linux_rpm_sig="$(cat "$linux_rpm_sig_file")"
          win_sig="$(cat "$win_sig_file")"
          mac_url="${BASE_URL}/$(basename "$mac_tar")"
          linux_url="${BASE_URL}/$(basename "$linux_img")"
          linux_deb_url="${BASE_URL}/$(basename "$linux_deb")"
          linux_rpm_url="${BASE_URL}/$(basename "$linux_rpm")"
          win_url="${BASE_URL}/$(basename "$win_exe")"

          export TAG VERSION PUB_DATE REPO \
            mac_sig linux_sig linux_deb_sig linux_rpm_sig win_sig \
            mac_url linux_url linux_deb_url linux_rpm_url win_url
          python3 - <<'PY' > latest.json
          import json, os
          manifest = {
              "version": os.environ["VERSION"],
              "notes": f"See https://github.com/{os.environ['REPO']}/releases/tag/{os.environ['TAG']}",
              "pub_date": os.environ["PUB_DATE"],
              "platforms": {
                  "darwin-aarch64":   {"signature": os.environ["mac_sig"],       "url": os.environ["mac_url"]},
                  "darwin-x86_64":    {"signature": os.environ["mac_sig"],       "url": os.environ["mac_url"]},
                  "linux-x86_64":     {"signature": os.environ["linux_sig"],     "url": os.environ["linux_url"]},
                  "linux-x86_64-deb": {"signature": os.environ["linux_deb_sig"], "url": os.environ["linux_deb_url"]},
                  "linux-x86_64-rpm": {"signature": os.environ["linux_rpm_sig"], "url": os.environ["linux_rpm_url"]},
                  "windows-x86_64":   {"signature": os.environ["win_sig"],       "url": os.environ["win_url"]},
              },
          }
          print(json.dumps(manifest, indent=2))
          PY
          echo "--- latest.json ---"
          cat latest.json

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/furx-macos/**/*
            artifacts/furx-linux/**/*
            artifacts/furx-windows/**/*
            latest.json
