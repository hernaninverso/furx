[package]
name = "furx"
version = "0.1.0"
edition = "2021"
description = "Furx — run any coding agent side-by-side. No proxy."
authors = ["The Furx Authors"]

[lib]
name = "furx_lib"
crate-type = ["lib"]

[[bin]]
name = "furx"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Sprint #5 — custom URL scheme furx://auth?token=... so magic-link emails open Furx directly.
tauri-plugin-deep-link = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
portable-pty = "0.8"
bytes = "1"
lru = "0.18"
governor = "0.6"
nonzero_ext = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
regex = "1"
sha2 = "0.10"
base64 = "0.22"
tar = "0.4"
zstd = "0.13"
arboard = { version = "3", default-features = false }
hmac = "0.12"
hex = "0.4"
url = "2"
# spec-kit 001 — plugin manifest signature verification (Ed25519).
ed25519-dalek = "2"
# spec-kit 043 — Unicode NFC normalization for canonical tree_hash of skill files
# (APFS stores filenames without forcing NFC; NFC before sort+hash → cross-platform
# determinism). v7 gotcha NON-NEGOTIABLE.
unicode-normalization = "0.1"
# spec-kit 043 — jitter for BEGIN IMMEDIATE retry backoff (±20ms anti thundering-herd).
rand = "0.8"
# spec-kit 043 F4 — parse sources.user.toml (discovery local sources, type=local only).
toml = "0.8"
# spec-kit 001 · T028 — WASM runtime for untrusted-logic plugins. Optional + off by
# default (YAGNI: no WASM plugins ship yet); enable with --features wasm-runtime.
wasmtime = { version = "27", optional = true, default-features = false, features = ["cranelift", "runtime", "wat"] }
notify = "8"
notify-debouncer-mini = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
subtle = "2"
# Native macOS Keychain API (no argv leak via ps -ef). HIGH fix (Gemini audit B1).
keyring = { version = "3", default-features = false, features = ["apple-native", "sync-secret-service", "windows-native"] }
blake3 = "1"
walkdir = "2"
serde_yaml = "0.9"
# BLOQUE H · D — streaming download for whisper model (progress events).
futures-util = { version = "0.3", default-features = false }
# BLOQUE J ext 2 · mobile_bridge mDNS advertising (_furx._tcp.local).
mdns-sd = { version = "0.13", default-features = false }
hostname = "0.4"
# 065 — pairing QR: percent-encode el hostname en el URI del QR.
percent-encoding = "2"
# 004 mobile-companion (MC-5): enumerate local interfaces to find the Tailscale
# CGNAT IP (100.64.0.0/10) WITHOUT shelling out to the `tailscale` CLI.
if-addrs = "0.13"
# 010-furx-signals — async trait objects for the Sink dispatcher.
async-trait = "0.1"
# 010-furx-signals — desktop notifications sink (BYOK-clean, local-only).
tauri-plugin-notification = "2"
# 019 F0 · T005 (audit r3 HIGH) — advisory OS file lock to serialize the DESTRUCTIVE
# git of a kill (worktree remove / reset --hard) across concurrent killers. flock(LOCK_EX)
# auto-releases if the holder process dies → no deadlock by a dead/hung killer.
fs2 = "0.4"

# 019 F3 (T030) — SIGSTOP/SIGCONT del proceso PTY para pause/resume de un attempt (sólo Unix).
# Pausar NUNCA mata: detiene el proceso (y su grupo) y lo reanuda intacto.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# 004 mobile-companion E2E: real WebSocket client to drive the bridge over TCP.
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
default = []
wasm-runtime = ["dep:wasmtime"]
